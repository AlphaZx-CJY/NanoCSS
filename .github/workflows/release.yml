name: Publish to NPM on Tag Push

on:
  push:
    # 匹配任何以v开头的标签(例如 v1.0.0, v2.3.4)
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 推荐使用LTS版本
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci # 更干净的安装方式，适合CI环境

      - name: Build Package (Optional)
        run: npm run build --if-present # 如果package.json中有build脚本则执行

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 从GitHub secrets获取npm token
